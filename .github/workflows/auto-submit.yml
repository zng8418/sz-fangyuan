name: 自动推送 sitemap 到 IndexNow / Yandex / Bing

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '.github/workflows/auto-submit.yml'
  schedule:
    # 每天 3 次：8/14/20 UTC (北京 16/22/4 点)
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送所有 URL（忽略 history）'
        required: false
        default: 'false'

jobs:
  auto-submit:
    name: 提交到搜索引擎
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 提取所有 URL (从 sitemap.xml)
        id: urls
        run: |
          # 从 sitemap 抓 URL
          python3 -c "
          import re, urllib.request
          urls = []
          try:
              with open('sitemap.xml', 'r', encoding='utf-8') as f:
                  content = f.read()
              urls = re.findall(r'<loc>(.*?)</loc>', content)
              print(f'从 sitemap.xml 抓到 {len(urls)} 个 URL')
          except Exception as e:
              print(f'! 读 sitemap.xml 失败: {e}')
          # 默认首页
          if not urls:
              urls = ['https://zng8418.github.io/sz-fangyuan/']
          # 写到 GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'w') as f:
              f.write('urls<<EOF\n' + '\n'.join(urls) + '\nEOF\n')
          import os
          print('URLs:')
          for u in urls: print(' -', u)
          " | tee -a $GITHUB_OUTPUT

      - name: 推送到 IndexNow (Bing + Yandex + DuckDuckGo + etc)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ -z "$INDEXNOW_KEY" ]]; then
            echo "::warning::INDEXNOW_KEY secret 未配置，跳过 IndexNow"
            exit 0
          fi
          # 构造 json payload
          python3 -c "
          import json, os
          key = os.environ['INDEXNOW_KEY']
          urls = '''${{ steps.urls.outputs.urls }}'''.strip().split('\n')
          urls = [u for u in urls if u]
          payload = {
              'host': 'zng8418.github.io',
              'key': key,
              'keyLocation': f'https://zng8418.github.io/sz-fangyuan/{key}.txt',
              'urlList': urls
          }
          print(json.dumps(payload, ensure_ascii=False))
          " > /tmp/indexnow.json
          
          cat /tmp/indexnow.json
          echo ""
          echo "--- POST https://api.indexnow.org/indexnow ---"
          http_code=$(curl -sS -o /tmp/idx_resp.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --max-time 30 -d @/tmp/indexnow.json)
          echo "HTTP $http_code"
          cat /tmp/idx_resp.txt 2>/dev/null

      - name: 推送到 Yandex
        run: |
          sitemap_url="https://zng8418.github.io/sz-fangyuan/sitemap.xml"
          echo "--- POST http://webmaster.yandex.com/ping ---"
          http_code=$(curl -sS -o /tmp/yandex_resp.txt -w "%{http_code}" \
            -X POST "http://webmaster.yandex.com/ping" \
            --max-time 15 -d "sitemap=$sitemap_url")
          echo "HTTP $http_code"
          cat /tmp/yandex_resp.txt 2>/dev/null

      - name: 推送到 百度 (如果配置了 token)
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BAIDU_SITE: ${{ secrets.BAIDU_SITE }}
        run: |
          if [[ -z "$BAIDU_TOKEN" || -z "$BAIDU_SITE" ]]; then
            echo "::warning::BAIDU_TOKEN/BAIDU_SITE secret 未配置，跳过百度主动推送"
            echo "(耿哥登录 https://ziyuan.baidu.com → 链接提交 → 主动推送后告诉我 token，我会配置好)"
            exit 0
          fi
          echo "--- POST http://data.zz.baidu.com/urls ---"
          # 多个 URL 用 \n 分隔
          URLS=$(echo "${{ steps.urls.outputs.urls }}" | tr '\n' '\n')
          http_code=$(curl -sS -o /tmp/baidu_resp.txt -w "%{http_code}" \
            -X POST "http://data.zz.baidu.com/urls?site=$BAIDU_SITE&token=$BAIDU_TOKEN" \
            --max-time 30 -d "$URLS")
          echo "HTTP $http_code"
          cat /tmp/baidu_resp.txt 2>/dev/null
